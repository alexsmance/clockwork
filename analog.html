<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analog - Chronos</title>
  <link href="./assets/terra.css" rel="stylesheet" />
  <link href="./assets/style.css" rel="stylesheet" />
  <script src="js/p5.min.js"></script>
  <style>
    * {
     box-sizing: border-box; 
    }

    body {
      padding: 0;      
    }

    header {
      position: absolute;
      top: 0;
      left: 0;
      background: #333333;
      color: white;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1 class="subheading">Chronos</h1>
  </header> 
  <script>    
    let secondsRadius;
    let minutesRadius;
    let hoursRadius;
    let clockDiameter;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      stroke(51);
      angleMode(DEGREES);
      
      let radius = min(width, height) / 3;
      secondsRadius = radius * 0.71;
      minutesRadius = radius * 0.6;
      hoursRadius = radius * 0.5;
      clockDiameter = radius * 1.7;

      describe('Functioning pink clock on a grey background.');
    }

    function draw() {
      background(51);
      
      translate(width / 2, height / 2);
      
      noStroke();
      fill(51, 51, 51);
      ellipse(0, 0, clockDiameter + 25, clockDiameter + 25);
      fill(255, 255, 255);
      ellipse(0, 0, clockDiameter, clockDiameter);
      
      let secondAngle = map(second(), 0, 60, 0, 360);
      let minuteAngle = map(minute(), 0, 60, 0, 360);
      let hourAngle = map(hour(), 0, 12, 0, 360);

      stroke(0);

      // Second hand
      push();
      rotate(secondAngle);
      strokeWeight(2);
      line(0, 0, 0, -secondsRadius);
      pop();

      // Minute hand
      push();
      strokeWeight(4);
      rotate(minuteAngle);
      line(0, 0, 0, -minutesRadius);
      pop();

      // Hour hand
      push();
      strokeWeight(6);
      rotate(hourAngle);
      line(0, 0, 0, -hoursRadius);
      pop();

      // Tick markers around perimeter of clock
      push();
      strokeWeight(4);
      for (let ticks = 0; ticks < 60; ticks += 1) {
        point(0, -secondsRadius);
        rotate(6);
      }
      pop();
    }

    window.addEventListener('resize', () => {
      windowWidth = window.innerWidth;
      windowHeight = window.innerHeight;
      centerX = windowWidth / 2;
      centerY = windowHeight / 2;
      setup();
    });
  </script>
</body>
</html>
